# Pull request and branch checks: types, lint, formatting, tests with coverage, build,
# generated documentation, production dependency audit and production licence allow-list.

name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: install
        run: npm ci

      - name: type-check
        run: npm run type:check

      - name: lint
        run: npm run lint

      - name: format
        run: npm run format

      - name: test
        run: npm run test:cov

      - name: build
        run: npm run build

      # The reference pages are generated from src/; this fails when they are stale.
      - name: docs
        run: npm run docs:check

      - name: readme-translations
        run: npm run docs:check-i18n

      - name: audit
        run: npm audit --omit=dev --audit-level=high

      # Production dependencies must use a permissive licence compatible with Apache-2.0.
      - name: licences
        run: >-
          npx --yes license-checker-rseidelsohn@5.0.1
          --production
          --excludePrivatePackages
          --summary
          --onlyAllow "Apache-2.0;MIT;BSD-2-Clause;BSD-3-Clause;ISC;0BSD"

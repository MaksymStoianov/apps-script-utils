# https://github.com/googleapis/release-please-action
# https://github.com/marketplace/actions/release-please-action

on:
  push:
    branches:
      - main
  # Publishes an existing release by hand (for example one released before this job existed).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to npm, e.g. apps-script-utils-v2.1.1"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    if: github.event_name == 'push' && github.server_url == 'https://github.com' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      # Manifest mode, not `release-type`. Without a manifest the action looks for
      # the previous release by walking back through the commits on main, and the
      # window it searches no longer reaches v1.10.0 — it concluded nothing had
      # ever been released and proposed 1.0.0.
      - name: release-please-action
        id: release
        uses: googleapis/release-please-action@v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
#          versioning-strategy: auto
#          changelog-path: CHANGELOG.md

  # npm trusted publishing (OIDC): no npm token is stored in GitHub. Needs a trusted publisher on
  # npmjs.com → apps-script-utils → Settings → Trusted publishing: GitHub Actions,
  # MaksymStoianov/apps-script-utils, workflow release-please.yml, environment npm, Publish allowed.
  publish:
    needs: release-please
    if: >-
      always() && github.server_url == 'https://github.com' &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

      - name: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      - name: test
        run: npm test

      - name: publish
        run: npm publish --provenance --access public

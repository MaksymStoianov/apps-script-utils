# https://github.com/googleapis/release-please-action
# https://github.com/marketplace/actions/release-please-action

on:
  push:
    branches:
      - main
  # Publishes an existing release by hand (for example one released before this job existed).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to npm, e.g. apps-script-utils-v3.0.0"
        required: true

# Every job declares only the permissions it needs.
permissions: {}

name: release-please

jobs:
  release-please:
    if: github.event_name == 'push' && github.server_url == 'https://github.com' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      # Manifest mode, not `release-type`. Without a manifest the action looks for
      # the previous release by walking back through the commits on main, and the
      # window it searches no longer reaches v1.10.0 — it concluded nothing had
      # ever been released and proposed 1.0.0.
      - name: release-please-action
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # npm trusted publishing (OIDC): no npm token is stored in GitHub. Needs a trusted publisher on
  # npmjs.com → @bootgs/utils → Settings → Trusted publishing: GitHub Actions, bootgs/utils,
  # workflow release-please.yml, environment npm.
  publish:
    needs: release-please
    if: >-
      always() && github.server_url == 'https://github.com' &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      - name: test
        run: npm test

      - name: publish
        run: npm publish --provenance --access public

  # CycloneDX SBOM of the production dependency tree, attached to the GitHub release.
  sbom:
    needs: [release-please, publish]
    if: >-
      always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: install
        run: npm ci --ignore-scripts

      - name: sbom
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" sbom.cdx.json --clobber --repo "$GITHUB_REPOSITORY"

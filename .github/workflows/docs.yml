# Builds the Writerside documentation in `docs/writerside*/` and publishes it to
# GitHub Pages: English at the site root, the other languages under /<code>/.
#
# https://www.jetbrains.com/help/writerside/deploy-docs-to-github-pages.html
# https://github.com/JetBrains/writerside-github-action

name: docs

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "docs/**"
      - "scripts/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Allow one concurrent deployment; queued runs supersede each other rather than
# racing to publish.
concurrency:
  group: docs
  cancel-in-progress: false

env:
  # The builder locates the module as `<module>/<instance>`, a single path
  # segment plus the instance id from the tree file, resolved against the source
  # directory. The rest of the path goes to the action's `location`.
  LOCATION: docs
  # Every language project uses the instance id `asu`, so the builder names its
  # artifact the same way in each of them.
  ARTIFACT: webHelpASU2-all.zip
  # Writerside builder image version. It has to be recent enough to understand
  # the llms.txt generation that the build profiles switch on; the version below
  # is the one the Writerside documentation currently names.
  DOCKER_VERSION: 2026.08.0328

jobs:
  # The language projects and the reference pages are generated from src/ and
  # docs/content/. This fails the run when they have not been regenerated.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the documentation matches the sources
        run: node scripts/docs/generate-topics.mjs --check

      # Every documented result of the form `expr; // => value` is executed
      # against the real implementation.
      - name: Check the documented examples
        run: node scripts/docs/verify-examples.mjs

      # The JSDoc an IDE shows has to carry the same example as the page.
      - name: Check the examples in the sources
        run: node scripts/docs/sync-jsdoc-examples.mjs --check

      # And the same links: to the page itself, and to the Apps Script reference.
      - name: Check the links in the sources
        run: node scripts/docs/sync-jsdoc-links.mjs --check

  build:
    needs: generated
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language:
          - { code: en, module: writerside }
          - { code: ru, module: writerside-ru }
          - { code: uk, module: writerside-uk }
          - { code: de, module: writerside-de }
          - { code: fr, module: writerside-fr }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build docs using the Writerside Docker builder
        uses: JetBrains/writerside-github-action@v4
        with:
          location: ${{ env.LOCATION }}
          instance: ${{ matrix.language.module }}/asu
          docker-version: ${{ env.DOCKER_VERSION }}

      - name: Upload build results
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ matrix.language.code }}
          path: |
            artifacts/${{ env.ARTIFACT }}
            artifacts/report.json
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        language:
          - { code: en, module: writerside }
          - { code: ru, module: writerside-ru }
          - { code: uk, module: writerside-uk }
          - { code: de, module: writerside-de }
          - { code: fr, module: writerside-fr }

    steps:
      - name: Download build results
        uses: actions/download-artifact@v4
        with:
          name: docs-${{ matrix.language.code }}
          path: artifacts

      - name: Check for broken links and other problems
        uses: JetBrains/writerside-checker-action@v1
        with:
          instance: ${{ matrix.language.module }}/asu

  # The page the reader gets is the finalized one, not what the builder emits:
  # the structured data, the canonical link, the language switcher, the search
  # widget and the notice are written in by scripts/docs/finalize-site.mjs,
  # because the build profile that would carry them is ignored on this builder.
  # A page that comes out without them should fail here, not be noticed on the
  # live site a release later.
  assembled:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build results
        uses: actions/download-artifact@v4
        with:
          pattern: docs-*
          path: artifacts

      - name: Assemble the site
        run: |
          set -euo pipefail

          unzip -qq "artifacts/docs-en/${ARTIFACT}" -d dir

          for code in ru uk de fr; do
            unzip -qq "artifacts/docs-${code}/${ARTIFACT}" -d "dir/${code}"
          done

      - name: Finalize the site for crawlers
        run: node scripts/docs/finalize-site.mjs dir

      - name: Check that every page carries what it should
        run: |
          set -euo pipefail

          missing=0

          for page in dir/overview.html dir/ru/overview.html dir/appendcolumns.html; do
            for marker in 'rel="canonical"' 'asu-fab' 'SoftwareSourceCode' 'asu-ai-notice'; do
              if ! grep -qF "$marker" "$page"; then
                echo "::error::${page} is missing ${marker}"
                missing=1
              fi
            done

            if ! grep -qE 'og:image"[^>]*content="[^"]+"' "$page"; then
              echo "::error::${page} has an empty og:image"
              missing=1
            fi
          done

          exit "$missing"

  deploy:
    # Only the default branch publishes; pull requests stop after build and test.
    if: github.ref == 'refs/heads/main' && github.server_url == 'https://github.com'
    needs: [test, assembled]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build results
        uses: actions/download-artifact@v4
        with:
          pattern: docs-*
          path: artifacts

      - name: Assemble the site
        run: |
          set -euo pipefail

          unzip -qq "artifacts/docs-en/${ARTIFACT}" -d dir

          for code in ru uk de fr; do
            unzip -qq "artifacts/docs-${code}/${ARTIFACT}" -d "dir/${code}"
          done

      # Feeds the search widget injected by each project's search.html. Every
      # language gets its own index, next to its own pages.
      - name: Build the search indexes
        run: |
          set -euo pipefail

          node scripts/docs/build-search-index.mjs dir

          for code in ru uk de fr; do
            node scripts/docs/build-search-index.mjs "dir/${code}"
          done

      # Writes the hreflang links into the served HTML, one sitemap covering
      # every language, and robots.txt. It has to run after all five builds are
      # in place, because that is when the alternates are known.
      - name: Finalize the site for crawlers
        run: node scripts/docs/finalize-site.mjs dir

      # Pages replaces everything it serves on each deploy, so the archive of
      # earlier versions lives in a branch of its own and is restored here.
      - name: Archive this version
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"

          (cd dir && zip -qr "../${version}.zip" .)

          git clone --depth 1 --branch docs-archive \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" archive 2>/dev/null || {
              mkdir -p archive
              cd archive
              git init -q
              git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
              git checkout -q --orphan docs-archive
              cd ..
            }

          mkdir -p archive/versions
          cp "${version}.zip" "archive/versions/${version}.zip"

          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions
          git commit -qm "docs: archive the site of ${version}" || echo "nothing new to archive"
          git push -q origin docs-archive

      - name: Restore the versions published before this one
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"

          for zip in archive/versions/*.zip; do
            [ -e "$zip" ] || continue

            archived="$(basename "$zip" .zip)"

            [ "$archived" = "$version" ] && continue

            mkdir -p "dir/${archived}"
            unzip -qq "$zip" -d "dir/${archived}"
          done

          cp "${version}.zip" "dir/${version}.zip" 2>/dev/null || true
          rm -f "dir/${version}.zip"

          mkdir -p "dir/${version}"
          unzip -qq "${version}.zip" -d "dir/${version}"

      # What the version switcher in the header reads.
      - name: Write help-versions.json
        run: node scripts/docs/write-help-versions.mjs dir "$(node -p "require('./package.json').version")"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dir

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

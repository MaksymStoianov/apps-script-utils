<style>
  .asu-fab {
    position: fixed;
    bottom: 24px;
    z-index: 2147483000;
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 10px 16px;
    border: 1px solid rgba(39, 40, 44, 0.16);
    border-radius: 999px;
    background: #fff;
    box-shadow: 0 6px 20px rgba(39, 40, 44, 0.18);
    color: #27282c;
    font:
      500 14px/1.2 system-ui,
      -apple-system,
      "Segoe UI",
      Roboto,
      sans-serif;
    cursor: pointer;
  }

  #asu-search-open {
    right: 24px;
  }

  #asu-language-open {
    right: 160px;
  }

  .asu-fab kbd {
    padding: 2px 6px;
    border: 1px solid rgba(39, 40, 44, 0.2);
    border-radius: 4px;
    font:
      500 11px/1 ui-monospace,
      SFMono-Regular,
      Menlo,
      monospace;
    opacity: 0.7;
  }

  #asu-language-menu {
    position: fixed;
    right: 160px;
    bottom: 76px;
    z-index: 2147483000;
    display: none;
    min-width: 160px;
    padding: 6px;
    border: 1px solid rgba(39, 40, 44, 0.16);
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 12px 32px rgba(39, 40, 44, 0.22);
    font:
      14px/1.4 system-ui,
      -apple-system,
      "Segoe UI",
      Roboto,
      sans-serif;
  }

  #asu-language-menu[open] {
    display: block;
  }

  #asu-language-menu a {
    display: block;
    padding: 8px 10px;
    border-radius: 6px;
    color: #27282c;
    text-decoration: none;
  }

  #asu-language-menu a:hover {
    background: rgba(48, 127, 255, 0.12);
  }

  #asu-language-menu a[aria-current="true"] {
    font-weight: 600;
  }

  #asu-search-dialog {
    position: fixed;
    inset: 0;
    z-index: 2147483001;
    display: none;
    padding: 10vh 16px 16px;
    background: rgba(19, 20, 22, 0.55);
  }

  #asu-search-dialog[open] {
    display: block;
  }

  #asu-search-panel {
    max-width: 680px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
    color: #27282c;
    font:
      14px/1.5 system-ui,
      -apple-system,
      "Segoe UI",
      Roboto,
      sans-serif;
  }

  #asu-search-input {
    width: 100%;
    box-sizing: border-box;
    padding: 18px 20px;
    border: 0;
    border-bottom: 1px solid rgba(39, 40, 44, 0.12);
    background: transparent;
    color: inherit;
    font: 16px/1.4 inherit;
    outline: none;
  }

  #asu-search-results {
    max-height: 60vh;
    margin: 0;
    padding: 8px;
    overflow-y: auto;
    list-style: none;
  }

  #asu-search-results li a {
    display: block;
    padding: 10px 12px;
    border-radius: 8px;
    color: inherit;
    text-decoration: none;
  }

  #asu-search-results li[aria-selected="true"] a,
  #asu-search-results li a:hover {
    background: rgba(48, 127, 255, 0.12);
  }

  #asu-search-results .asu-title {
    font-weight: 600;
  }

  #asu-search-results .asu-snippet {
    margin-top: 2px;
    opacity: 0.75;
    font-size: 13px;
  }

  #asu-search-results mark {
    padding: 0 1px;
    border-radius: 2px;
    background: rgba(255, 214, 0, 0.45);
    color: inherit;
  }

  #asu-search-status {
    padding: 14px 20px;
    opacity: 0.7;
  }

  @media (max-width: 640px) {
    #asu-language-open {
      right: 24px;
      bottom: 76px;
    }

    #asu-language-menu {
      right: 24px;
      bottom: 128px;
    }
  }

  @media (prefers-color-scheme: dark) {
    .asu-fab,
    #asu-language-menu,
    #asu-search-panel {
      border-color: rgba(255, 255, 255, 0.16);
      background: #1e1f22;
      color: #dfe1e5;
    }

    #asu-language-menu a {
      color: #dfe1e5;
    }

    #asu-search-input {
      border-bottom-color: rgba(255, 255, 255, 0.12);
    }
  }

  html[data-theme="dark"] .asu-fab,
  html[data-theme="dark"] #asu-language-menu,
  html[data-theme="dark"] #asu-search-panel {
    border-color: rgba(255, 255, 255, 0.16);
    background: #1e1f22;
    color: #dfe1e5;
  }

  html[data-theme="dark"] #asu-language-menu a {
    color: #dfe1e5;
  }

  @media print {
    .asu-fab,
    #asu-language-menu,
    #asu-search-dialog {
      display: none !important;
    }
  }
</style>

<button
  id="asu-language-open"
  class="asu-fab"
  type="button"
  aria-haspopup="true"
  aria-expanded="false"
>
  <span aria-hidden="true">🌐</span> Deutsch
</button>

<nav id="asu-language-menu" aria-label="Sprache">
  <a href="https://maksymstoianov.github.io/apps-script-utils/" hreflang="en">English</a>
  <a href="https://maksymstoianov.github.io/apps-script-utils/ru/" hreflang="ru">Русский</a>
  <a href="https://maksymstoianov.github.io/apps-script-utils/uk/" hreflang="uk">Українська</a>
  <a href="https://maksymstoianov.github.io/apps-script-utils/de/" hreflang="de" aria-current="true"
    >Deutsch</a
  >
  <a href="https://maksymstoianov.github.io/apps-script-utils/fr/" hreflang="fr">Français</a>
</nav>

<button id="asu-search-open" class="asu-fab" type="button" aria-label="Suche">
  <span aria-hidden="true">🔍</span> Suche <kbd>/</kbd>
</button>

<div id="asu-search-dialog" role="dialog" aria-modal="true" aria-label="Suche">
  <div id="asu-search-panel">
    <input
      id="asu-search-input"
      type="search"
      autocomplete="off"
      spellcheck="false"
      placeholder="Funktionen, Anleitungen und Beispiele durchsuchen…"
      aria-controls="asu-search-results"
    />
    <p id="asu-search-status">Tippen, um zu suchen.</p>
    <ul id="asu-search-results" role="listbox"></ul>
  </div>
</div>

<script>
  /**
   * The search widget and language switcher injected into every published page.
   *
   * `scripts/docs/site.mjs` reads this file and replaces `{"hint":"Tippen, um zu suchen.","missing":"Der Suchindex ist in diesem Build nicht verfügbar.","matches":"Treffer","empty":"Nichts gefunden für"}` with
   * the labels of the language being built. Keeping it a real file, rather than a
   * string inside the generator, is what keeps its regular expressions intact.
   */

  /* global __ASU_STRINGS__ */

  (function () {
    var strings = __ASU_STRINGS__;

    var dialog = document.getElementById("asu-search-dialog");

    var panel = document.getElementById("asu-search-panel");

    var input = document.getElementById("asu-search-input");

    var list = document.getElementById("asu-search-results");

    var status = document.getElementById("asu-search-status");

    var open = document.getElementById("asu-search-open");

    var languageButton = document.getElementById("asu-language-open");

    var languageMenu = document.getElementById("asu-language-menu");

    var index = null;

    var loading = null;

    var hits = [];

    var cursor = 0;

    // Every language publishes the same file names, so a language link keeps the
    // reader on the page they were reading.
    Array.prototype.forEach.call(languageMenu.querySelectorAll("a"), function (link) {
      var file = window.location.pathname.split("/").pop();

      if (file && file.indexOf(".html") !== -1) {
        link.href = link.getAttribute("href") + file;
      }
    });

    function base() {
      var path = window.location.pathname;

      return path.slice(0, path.lastIndexOf("/") + 1);
    }

    function load() {
      if (loading) {
        return loading;
      }

      loading = fetch(base() + "search-index.json")
        .then(function (response) {
          if (!response.ok) {
            throw new Error(String(response.status));
          }

          return response.json();
        })
        .then(function (data) {
          index = data;

          return data;
        })
        .catch(function () {
          index = [];
          status.textContent = strings.missing;

          return [];
        });

      return loading;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"]/g, function (character) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[character];
      });
    }

    function highlight(text, terms) {
      var html = escapeHtml(text);

      terms.forEach(function (term) {
        var pattern = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");

        html = html.replace(pattern, "<mark>$1</mark>");
      });

      return html;
    }

    function snippetOf(entry, terms) {
      var text = entry.text || "";

      var at = -1;

      terms.some(function (term) {
        at = text.toLowerCase().indexOf(term);

        return at !== -1;
      });

      if (at === -1) {
        return entry.summary || text.slice(0, 140);
      }

      var from = Math.max(0, at - 60);

      return (from > 0 ? "…" : "") + text.slice(from, from + 160) + "…";
    }

    function score(entry, terms) {
      var title = (entry.title || "").toLowerCase();

      var text = ((entry.summary || "") + " " + (entry.text || "")).toLowerCase();

      var total = 0;

      for (var i = 0; i < terms.length; i += 1) {
        var term = terms[i];

        if (title === term) {
          total += 120;
        } else if (title.indexOf(term) === 0) {
          total += 60;
        } else if (title.indexOf(term) !== -1) {
          total += 30;
        } else if (text.indexOf(term) !== -1) {
          total += 5;
        } else {
          return 0;
        }
      }

      return total;
    }

    function render(terms) {
      list.innerHTML = "";

      hits.forEach(function (entry, position) {
        var item = document.createElement("li");

        item.setAttribute("role", "option");
        item.setAttribute("aria-selected", position === cursor ? "true" : "false");

        var link = document.createElement("a");

        link.href = base() + entry.url;
        link.innerHTML =
          '<span class="asu-title">' +
          highlight(entry.title, terms) +
          "</span>" +
          '<div class="asu-snippet">' +
          highlight(snippetOf(entry, terms), terms) +
          "</div>";

        item.appendChild(link);
        list.appendChild(item);
      });
    }

    function search() {
      var query = input.value.trim().toLowerCase();

      if (!query) {
        hits = [];
        list.innerHTML = "";
        status.textContent = strings.hint;

        return;
      }

      load().then(function () {
        var terms = query.split(/\s+/).filter(Boolean);

        hits = (index || [])
          .map(function (entry) {
            return { entry: entry, score: score(entry, terms) };
          })
          .filter(function (row) {
            return row.score > 0;
          })
          .sort(function (a, b) {
            return b.score - a.score;
          })
          .slice(0, 25)
          .map(function (row) {
            return row.entry;
          });

        cursor = 0;
        status.textContent = hits.length
          ? hits.length + " " + strings.matches
          : strings.empty + " “" + query + "”";

        render(terms);
      });
    }

    function show() {
      dialog.setAttribute("open", "");
      input.value = "";
      input.focus();
      status.textContent = strings.hint;
      list.innerHTML = "";
      load();
    }

    function hide() {
      dialog.removeAttribute("open");
    }

    function move(step) {
      if (hits.length === 0) {
        return;
      }

      cursor = (cursor + step + hits.length) % hits.length;

      Array.prototype.forEach.call(list.children, function (item, position) {
        item.setAttribute("aria-selected", position === cursor ? "true" : "false");
      });

      var selected = list.children[cursor];

      if (selected) {
        selected.scrollIntoView({ block: "nearest" });
      }
    }

    languageButton.addEventListener("click", function () {
      var opened = languageMenu.hasAttribute("open");

      if (opened) {
        languageMenu.removeAttribute("open");
      } else {
        languageMenu.setAttribute("open", "");
      }

      languageButton.setAttribute("aria-expanded", String(!opened));
    });

    document.addEventListener("click", function (event) {
      if (!languageMenu.contains(event.target) && event.target !== languageButton) {
        languageMenu.removeAttribute("open");
        languageButton.setAttribute("aria-expanded", "false");
      }
    });

    open.addEventListener("click", show);
    input.addEventListener("input", search);

    dialog.addEventListener("click", function (event) {
      if (!panel.contains(event.target)) {
        hide();
      }
    });

    document.addEventListener("keydown", function (event) {
      var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);

      if (!dialog.hasAttribute("open")) {
        var shortcut =
          (event.key === "/" && !typing) || ((event.metaKey || event.ctrlKey) && event.key === "k");

        if (shortcut) {
          event.preventDefault();
          show();
        }

        return;
      }

      if (event.key === "Escape") {
        hide();
      } else if (event.key === "ArrowDown") {
        event.preventDefault();
        move(1);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        move(-1);
      } else if (event.key === "Enter" && hits[cursor]) {
        event.preventDefault();
        window.location.href = base() + hits[cursor].url;
      }
    });
  })();
</script>
